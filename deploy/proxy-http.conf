server {
	listen 80;
	listen [::]:80;
	server_name chess.orciuolo.it;

	location ^~ /.well-known {
		allow all;
		root /data/letsencrypt/;
	}

	location / {
		resolver 127.0.0.11 valid=30s;
		set $chess_upstream http://chess-gif-editor:80;
		proxy_pass $chess_upstream;
		proxy_set_header Host $host;
	}
}
