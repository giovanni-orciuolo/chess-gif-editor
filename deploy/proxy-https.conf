server {
	listen 80;
	listen [::]:80;
	server_name chess.orciuolo.it;

	location ^~ /.well-known {
		allow all;
		root /data/letsencrypt/;
	}

	location / {
		return 301 https://chess.orciuolo.it$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name chess.orciuolo.it;

	ssl_certificate     /etc/letsencrypt/live/chess.orciuolo.it/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chess.orciuolo.it/privkey.pem;
	include tls.conf;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

	location / {
		resolver 127.0.0.11 valid=30s;
		set $chess_upstream http://chess-gif-editor:80;
		proxy_pass $chess_upstream;
		proxy_set_header Host $host;
	}
}
