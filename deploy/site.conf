server {
	listen 80;
	root /usr/share/nginx/html;

	types {
		application/manifest+json webmanifest;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location = /sw.js {
		add_header Cache-Control "no-cache";
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
